name: Build APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create project
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          echo '<html><body style="background:#07060b"></body></html>' > www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.itachi.bot",
            "appName": "𝑰𝑻𝑨𝑪𝑯𝑰 𝑩𝑶𝑻",
            "webDir": "www",
            "backgroundColor": "#07060b",
            "server": {
              "url": "http://144.217.64.5:5424/hub.html",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF
          npx cap add android

      - name: App icon and splash
        run: |
          cd app
          IM=$(command -v magick || command -v convert)
          if [ -f ../icon.png ]; then cp ../icon.png icon_src; else curl -fL --retry 3 -A "Mozilla/5.0" -o icon_src https://upload.satoru.click/files/25030c.jpg; fi
          $IM "icon_src[0]" -resize 1024x1024^ -gravity center -extent 1024x1024 icon.png
          RES=android/app/src/main/res
          find $RES -name 'ic_launcher*.webp' -delete
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            mkdir -p $RES/mipmap-$n
            $IM icon.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            cp $RES/mipmap-$n/ic_launcher.png $RES/mipmap-$n/ic_launcher_round.png
          done
          for d in mdpi:108 hdpi:162 xhdpi:216 xxhdpi:324 xxxhdpi:432; do
            n=${d%%:*}; s=${d##*:}; i=$((s*88/100))
            $IM icon.png -resize ${i}x${i} -background none -gravity center -extent ${s}x${s} $RES/mipmap-$n/ic_launcher_foreground.png
          done
          mkdir -p $RES/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#07060B</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml
          $IM icon.png -resize 260x260 logo.png
          for f in $(find $RES -name 'splash*.png'); do
            sz=$(identify -format "%wx%h" "$f")
            $IM -size $sz xc:'#07060B' logo.png -gravity center -composite "$f"
          done

      - name: Sync and allow http
        run: |
          cd app
          npx cap sync android
          grep -q usesCleartextTraffic android/app/src/main/AndroidManifest.xml || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../ITACHI-BOT.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ITACHI BOT v${{ github.run_number }}
          files: ITACHI-BOT.apk
