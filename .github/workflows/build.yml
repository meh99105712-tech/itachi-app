name: Build APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create project
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          echo '<html><body style="background:#07060b"></body></html>' > www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.itachi.bot",
            "appName": "𝑰𝑻𝑨𝑪𝑯𝑰 𝑩𝑶𝑻",
            "webDir": "www",
            "server": {
              "url": "http://144.217.64.5:5424/hub.html",
              "cleartext": true
            }
          }
          EOF
          npx cap add android

      - name: App icon
        continue-on-error: true
        run: |
          cd app
          mkdir -p assets
          curl -L -o icon.jpg https://upload.satoru.click/files/25030c.jpg
          convert icon.jpg -resize 1024x1024! assets/icon.png
          npm i -D @capacitor/assets
          npx capacitor-assets generate --android

      - name: Sync and allow http
        run: |
          cd app
          npx cap sync android
          grep -q usesCleartextTraffic android/app/src/main/AndroidManifest.xml || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../ITACHI-BOT.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ITACHI BOT v${{ github.run_number }}
          files: ITACHI-BOT.apk
